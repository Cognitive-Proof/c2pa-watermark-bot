[package]
name = "c2pa-watermark-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
c2pa = { version = "=0.90.23", default-features = false, features = ["rust_native_crypto"] }
hex = "0.4.3"
image = "0.25"
ndarray = "0.16"
ort = "=2.0.0-rc.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trustmark = "0.5"

[dev-dependencies]
base64 = "0.23.1"
hex = "0.4.3"
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }
